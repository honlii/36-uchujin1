<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07100d"><title>36宇宙人タイプ診断</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06100d;color:#eef7f1;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px 70px}.card{background:#0f1b16;border:1px solid #294239;border-radius:24px;padding:24px;box-shadow:0 18px 55px #0009}.tag{color:#91d8aa;letter-spacing:.12em;font-size:11px}.title{font-size:32px;margin:8px 0}.sub{color:#aebdb5;line-height:1.8}.field{margin:18px 0}.label{display:block;margin-bottom:8px;font-weight:700}input{width:100%;padding:14px;border-radius:12px;border:1px solid #3a5047;background:#07100d;color:#fff;font-size:16px}button{width:100%;padding:15px;border:0;border-radius:13px;background:#d9f3df;color:#0b1711;font-size:16px;font-weight:800;cursor:pointer;margin-top:5px}.note{font-size:12px;color:#899d94;line-height:1.7;margin-top:12px}.result{display:none;margin-top:28px}.alien{height:170px;border-radius:22px;background:radial-gradient(circle at 50% 39%,#d6ffe3 0 7%,transparent 8%),radial-gradient(ellipse at 50% 47%,#78ce98 0 25%,transparent 26%),radial-gradient(circle at 50% 80%,#1c4331 0 35%,transparent 36%),linear-gradient(135deg,#152b21,#07100d);position:relative;overflow:hidden}.alien:after{content:'✦  ✦';position:absolute;top:20px;left:0;right:0;text-align:center;font-size:32px;color:#dfffe8;opacity:.75}.small{font-size:12px;color:#92a69d}.type{font-size:27px;margin:15px 0 5px}.desc{line-height:1.9;color:#d6e2db}.sourcebox{margin-top:18px;background:#09130f;border:1px solid #273c33;border-radius:15px;padding:14px}.sourcebox b{font-size:13px}.sourcebox p{font-size:12px;line-height:1.7;color:#aabbb3;margin:7px 0 0}.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.score{background:#09130f;border-radius:13px;padding:12px}.bar{height:7px;background:#26352f;border-radius:6px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:#9bd8ae}.systems{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}.sys{background:#12211a;border-radius:12px;padding:12px;text-align:center}.sys strong{display:block;font-size:13px}.sys span{font-size:11px;color:#9eb1a8}.again{margin-top:16px;background:#1b2a24;color:#e7f5eb;border:1px solid #385148}.copy{background:#d9f3df;color:#0b1711}.err{display:none;color:#ffb4b4;margin-top:10px;font-size:13px}@media(max-width:520px){.scores{grid-template-columns:1fr}.systems{grid-template-columns:1fr}.title{font-size:28px}}
</style></head><body><main class="wrap"><div class="card">
<div class="tag">36 TYPE / COSMIC PERSONALITY</div><h1 class="title">36宇宙人タイプ診断</h1><p class="sub">四柱推命・算命学・姓名判断の考え方を10項目にまとめ、あなたの36タイプを診断します。</p>
<div class="field"><label class="label">お名前</label><input id="name" placeholder="例：宇宙 太郎" autocomplete="name"></div>
<div class="field"><label class="label">生年月日</label><input id="birth" type="date"></div>
<div class="field"><label class="label">出生時刻（任意）</label><input id="time" type="time"></div>
<button id="go">診断する</button><div id="err" class="err"></div>
<section id="result" class="result"><div class="alien"></div><div class="small" id="className"></div><h2 class="type" id="typeName"></h2><p class="desc" id="desc"></p>
<div class="systems" id="systems"></div><div class="scores" id="scores"></div>
<div class="sourcebox"><b>この診断について</b><p>占術ごとの考え方を性格傾向として統合したエンタメ診断です。流派や姓名の字体によって画数・命式の解釈は異なるため、占い結果を絶対的な性格判定として扱うものではありません。</p></div>
<button class="copy" id="copy">結果を引用する</button><button class="again" id="again">もう一度診断する</button></section>
</div></main>
<script>
const types=[
['突進宇宙人','開拓型','まず動いて道を作る。決断が速く、未知の状況でも前へ進める行動派。'],['背中で語る宇宙人','開拓型','多くを語らなくても行動で示す。自分の信念を静かに貫くタイプ。'],['リーダー宇宙人','開拓型','人をまとめ、方向を示すのが得意。責任を引き受けて先頭に立つ。'],['下剋上宇宙人','開拓型','現状に甘んじず、逆境ほど燃える。自分の力で状況をひっくり返したい。'],['情熱宇宙人','開拓型','好きなものには一直線。熱量が高く、周囲まで巻き込むエネルギーを持つ。'],['起爆宇宙人','開拓型','きっかけを作る人。停滞した空気を変え、新しい流れを生み出す。'],
['繊細なんです宇宙人','感性型','小さな変化や空気を敏感に感じる。繊細さが深い理解や優しさにつながる。'],['ロマン宇宙人','感性型','現実だけでは測れないものを大切にする。理想や物語に心を動かされる。'],['表情100通り宇宙人','感性型','感情が豊かで、場面に応じて多彩な表情を見せる。人を惹きつける魅力がある。'],['カメレオン宇宙人','感性型','相手や環境に合わせて自然に変化できる。適応力と観察力が高い。'],['芸術宇宙人','感性型','独自の感覚を形にする。美しさや違和感を見つけるセンスを持つ。'],['予言宇宙人','感性型','直感で先の流れを読むタイプ。言葉にならない気配を感じ取ることがある。'],
['分析宇宙人','知性型','物事を分解して考えるのが得意。納得できるまで観察し、整理する。'],['論理宇宙人','知性型','筋道を大切にする。感情に流されず、理由と仕組みから答えを探す。'],['研究宇宙人','知性型','気になったことを深く掘る。知識を集めるだけでなく、自分なりに理解したい。'],['戦略宇宙人','知性型','先を読んで動く計画派。複数の選択肢を考え、効率よく目的へ近づく。'],['平等宇宙人','知性型','立場に左右されず公平さを重視する。人や物事をフラットに見ようとする。'],['独自宇宙人','知性型','人と違う視点を持つ。常識よりも、自分で考えて出した答えを信じる。'],
['お堅い宇宙人','安定型','ルールや責任を大切にする。慎重に積み上げ、信頼を守ることを重視する。'],['縁の下宇宙人','安定型','目立つより支える側。必要なところを察して、静かに全体を整える。'],['コツコツ宇宙人','安定型','小さな努力を続けられる。派手さより積み重ねで結果を作る。'],['俺に任せとけ宇宙人','安定型','いざという時に頼られる存在。責任を引き受け、最後までやり切ろうとする。'],['騎士宇宙人','安定型','守るものがあるほど強くなる。義理や約束を大切にし、忠誠心が深い。'],['謙虚宇宙人','安定型','自分を大きく見せるより、相手を尊重する。静かな強さを持つ。'],
['アクティブ宇宙人','自由型','じっとしているより体験したい。行動範囲を広げ、新しい刺激を楽しむ。'],['俺は俺宇宙人','自由型','自分のペースを大切にする。周囲に合わせすぎず、自分らしい選択をする。'],['偉人系宇宙人','自由型','大きな理想を描き、自分なりの道を切り開く。独特の存在感がある。'],['少年宇宙人','自由型','好奇心が強く、遊び心を失わない。新しいものを素直に面白がれる。'],['イツマイライフ宇宙人','自由型','人生は自分のものという感覚が強い。型にはめられず、自分の楽しみを追求する。'],['放浪宇宙人','自由型','一つの場所や価値観に縛られない。知らない景色や経験を求めて動く。'],
['底まで愛すよ宇宙人','絆型','一度大切だと思った相手には深く向き合う。表面的ではないつながりを求める。'],['ヒーラー宇宙人','絆型','人の痛みや疲れに気づきやすい。そばにいることで安心感を与える。'],['思いは墓場まで一途宇宙人','絆型','簡単には気持ちを手放さない。長く続く思いや約束を大切にする。'],['人類ラブ宇宙人','絆型','人そのものへの関心が強い。違いを越えて人とつながることを楽しむ。'],['生涯モテ宇宙人','絆型','自然と人を惹きつける華やかさがある。親しみやすさと魅力を併せ持つ。'],['カリスマ宇宙人','絆型','人を惹きつける存在感が強い。言葉や態度で周囲に影響を与えやすい。']];
const axes=['行動力','意志力','感受性','表現力','分析力','戦略性','安定性','自由度','愛情深さ','影響力'];
const groups=['開拓型','感性型','知性型','安定型','自由型','絆型'];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dateParts(b){const [y,m,d]=b.split('-').map(Number);return {y,m,d}}
function stemBranchYear(y){const stems=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'],branches=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];let n=y-4;return stems[((n%10)+10)%10]+branches[((n%12)+12)%12]}
function dayPillar(y,m,d){let jd=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(2000,0,7))/86400000);let k=((jd%60)+60)%60;const s=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'],b=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];return s[k%10]+b[k%12]}
function nameSignal(name){let clean=[...name].filter(c=>/\p{L}/u.test(c));let sum=0;clean.forEach((c,i)=>{sum+=(c.codePointAt(0)%97)+i*7});return hash(clean.join('')+'|'+sum)}
function calc(name,birth,time){const {y,m,d}=dateParts(birth);const yp=stemBranchYear(y);const dp=dayPillar(y,m,d);const ns=nameSignal(name);const bh=hash(birth+time);const th=hash(name+'|'+birth+'|'+time);let v=axes.map((_,i)=>1+((th>>>((i*5)%25))%5));
// 四柱推命系：年柱・日柱・季節を性質に反映（エンタメ統合値）
const season=(m*3+d)%12;v[0]=Math.max(1,Math.min(5,v[0]+(season%3)-1));v[1]=Math.max(1,Math.min(5,v[1]+(yp.charCodeAt(0)%3)-1));v[2]=Math.max(1,Math.min(5,v[2]+(dp.charCodeAt(0)%3)-1));
// 算命学系：五行バランスを簡易的に数値化
const elements=[y%5,m%5,d%5,(time||'12:00').length%5];const wood=elements.filter(x=>x===0).length,fire=elements.filter(x=>x===1).length,earth=elements.filter(x=>x===2).length,metal=elements.filter(x=>x===3).length,water=elements.filter(x=>x===4).length;v[3]=Math.max(1,Math.min(5,v[3]+fire-1));v[4]=Math.max(1,Math.min(5,v[4]+metal-1));v[5]=Math.max(1,Math.min(5,v[5]+earth-1));v[6]=Math.max(1,Math.min(5,v[6]+water-1));v[7]=Math.max(1,Math.min(5,v[7]+wood-1));
// 姓名判断系：名前の文字情報を独立シグナルとして統合
v[8]=1+((ns>>>4)%5);v[9]=1+((ns>>>9)%5);
// 6グループの傾向から36タイプを選択
const groupScores=[v[0]+v[1]+v[9],v[2]+v[3]+v[8],v[4]+v[5]+v[9],v[6]+v[1]+v[4],v[7]+v[0]+v[3],v[8]+v[2]+v[6]];let g=groupScores.indexOf(Math.max(...groupScores));let within=hash(name+'|'+birth+'|'+time+'|'+g)%6;let idx=g*6+within;return {idx,v,yp,dp,ns,groupScores}}
function show(){const n=document.getElementById('name').value.trim(),b=document.getElementById('birth').value,t=document.getElementById('time').value||'12:00';const err=document.getElementById('err');if(!n||!b){err.textContent='お名前と生年月日を入力してください。';err.style.display='block';return}err.style.display='none';const d=calc(n,b,t),x=types[d.idx];document.getElementById('className').textContent='あなたの宇宙人タイプ';document.getElementById('typeName').textContent='TYPE '+String(d.idx+1).padStart(2,'0')+'　'+x[0];document.getElementById('desc').textContent=x[2];document.getElementById('systems').innerHTML=`<div class="sys"><strong>四柱推命</strong><span>年柱 ${d.yp}<br>日柱 ${d.dp}</span></div><div class="sys"><strong>算命学</strong><span>${groups[d.idx/6|0]}傾向</span></div><div class="sys"><strong>姓名判断</strong><span>名前の性質を反映</span></div>`;document.getElementById('scores').innerHTML=axes.map((a,i)=>`<div class="score"><b>${a}</b><div class="small">${d.v[i]} / 5</div><div class="bar"><i style="width:${d.v[i]*20}%"></i></div></div>`).join('');document.getElementById('result').style.display='block';document.getElementById('result').scrollIntoView({behavior:'smooth'});window.lastResult={name:n,type:x[0],desc:x[2],v:d.v}}
document.getElementById('go').addEventListener('click',show);document.getElementById('copy').addEventListener('click',async()=>{if(!window.lastResult)return;const r=window.lastResult;const text=`36宇宙人タイプ診断\n\n${r.name}は「${r.type}」\n${r.desc}\n\n${axes.map((a,i)=>a+'：'+r.v[i]+'/5').join('｜')}`;try{await navigator.clipboard.writeText(text);alert('診断結果をコピーしました。');}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('診断結果をコピーしました。')}});document.getElementById('again').addEventListener('click',()=>{document.getElementById('result').style.display='none';window.scrollTo({top:0,behavior:'smooth'})});
</script></body></html>
